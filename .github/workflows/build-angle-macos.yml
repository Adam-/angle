name: Build ANGLE

on:
  workflow_dispatch:

env:
  ANGLE_VERSION: "ee071b31d1c7a55ccc2416ae55626b45be0e3ac5"

jobs:
  build-angle:
    runs-on: ${{ matrix.macos-version }}

    strategy:
      matrix:
        macos-version: [ "macos-15", "macos-15-intel" ]

    steps:
      - name: Clone depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Fetch ANGLE source
        run: |
          mkdir angle
          cd angle
          fetch angle

      - name: Checkout ANGLE revision
        working-directory: angle
        run: |
          git checkout ${{ env.ANGLE_VERSION }}
          gclient sync

      - name: Generate build files
        working-directory: angle
        run: |
          gn gen out/Release --args='
            is_debug=false
            is_clang=true
            angle_enable_d3d9=false
            angle_enable_d3d11=false
            angle_enable_null=false
            angle_enable_vulkan=false
            angle_enable_essl=false
            angle_enable_gl=true
            angle_enable_metal=true
            angle_enable_glsl=true
            angle_build_all=false
            mac_deployment_target="11.0"
          '

      - name: Build ANGLE
        working-directory: angle
        run: autoninja -C out/Release libEGL libGLESv2

      - name: Upload ANGLE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angle-macos-${{ matrix.macos-version }}
          path: |
            angle/out/Release/
