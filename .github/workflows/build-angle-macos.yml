name: Build ANGLE (macOS)

on:
  push:
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: macos-latest

    steps:
      - name: Clone depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Fetch ANGLE source
        run: |
          mkdir angle
          cd angle
          fetch angle

      - name: Checkout ANGLE revision
        working-directory: angle
        run: |
          git checkout bb55ea10fcef3759e4db7ef8a473a9ceac2c6aa6
          gclient sync

      - name: Generate build files
        working-directory: angle
        run: |
          gn gen out/Release --args='
            is_debug=false
            is_clang=true
            angle_enable_d3d9=false
            angle_enable_d3d11=false
            angle_enable_null=false
            angle_enable_vulkan=false
            angle_enable_essl=false
            angle_enable_gl=true
            angle_enable_metal=true
            angle_enable_glsl=true
            angle_build_all=false
          '

      - name: Build ANGLE
        working-directory: angle
        run: ninja -C out/Release libEGL libGLESv2

      - name: Upload ANGLE macOS dylibs
        uses: actions/upload-artifact@v4
        with:
          name: angle-macos-libs
          path: |
            angle/out/Release/libEGL.dylib
            angle/out/Release/libGLESv2.dylib
